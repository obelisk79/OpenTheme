# OpenSystem: OpenTheme styling in your desktop's own colours, light or dark
# Generated by tools/make_themes.py from tools/themes/OpenSystem.theme. Edit that file, not this one.

# ---- Roles: the only tokens the stylesheet uses ----
# Text
TextPrimary: "palette(window-text)"
TextSecondary: "palette(window-text)"
TextDisabled: "palette(placeholder-text)"
TextStrong: "palette(window-text)"
TextLink: "palette(link)"
# Surfaces
SurfaceBase: "palette(window)"
SurfaceOverlay: "palette(base)"
SurfaceOverlayHover: "palette(alternate-base)"
MenuBarBackground: "palette(window)"
SurfaceHover: "palette(midlight)"
SurfaceDisabled: "palette(window)"
# Inputs and controls
FieldBackground: "palette(base)"
FieldBorder: "palette(placeholder-text)"
ControlBackground: "palette(button)"
ControlBackgroundHover: "palette(midlight)"
ControlBorder: "palette(mid)"
IndicatorBorder: "palette(placeholder-text)"
# Accent: Subtle is the hover tint, Strong the selected fill
AccentColor: "palette(highlight)"
AccentSubtle: "palette(midlight)"
AccentSubtleBorder: "palette(highlight)"
TextOnAccentSubtle: "palette(window-text)"
AccentStrong: "palette(highlight)"
TextOnAccent: "palette(highlighted-text)"
# Borders
BorderSubtle: "palette(mid)"
BorderStrong: "palette(dark)"
BorderDisabled: "palette(midlight)"
BorderHover: "palette(highlight)"
BorderFocus: "palette(highlight)"
BorderEmphasis: "palette(highlight)"
# Item views
ViewAlternateRow: "palette(alternate-base)"
ViewGridLines: "palette(mid)"
ViewHeaderBackground: "palette(button)"
ViewHeaderBorder: "palette(mid)"
ViewGroupBackground: "palette(button)"
# Scrollbars, progress, tooltips
ScrollbarTrack: "palette(window)"
ScrollbarHandle: "palette(mid)"
ScrollbarHandleHover: "palette(dark)"
ProgressBackground: "palette(base)"
ProgressChunk: "palette(highlight)"
ProgressText: "palette(window-text)"
TooltipBackground: "palette(tooltip-base)"
TooltipText: "palette(tooltip-text)"
TooltipBorder: "palette(mid)"
# Overlay panels
OverlayHeaderBackground: "palette(button)"
OverlayGroupBackground: "palette(button)"
OverlayTitleBackground: "palette(window)"
# Images
IconVariant: "onsystem"
IconVariantOnAccent: "onsystem"
# Geometry
BorderWidth: "1px"
CornerRadius: "2px"
CornerRadiusLarge: "3px"
# Status and 3D view (used by the .cfg and the stock Sketcher tokens, not by the stylesheet)
StatusError: "#e03131"
StatusWarning: "#f08c00"
StatusSuccess: "#2f9e44"
ViewportHighlight: "#15aabf"
ViewportSelection: "#22b8cf"

# ---- Stock FreeCAD token names, for core widgets and other addons ----
PrimaryColor: "@SurfaceBase"
GeneralBackgroundColor: "@SurfaceBase"
GeneralAlternateBackgroundColor: "@ViewAlternateRow"
GeneralBackgroundHoverColor: "@SurfaceHover"
GeneralBorderColor: "@BorderSubtle"
GeneralBorderHoverColor: "@BorderHover"
GeneralDisabledBackgroundColor: "@SurfaceDisabled"
GeneralGridLinesColor: "@ViewGridLines"
GeneralHeaderBackgroundColor: "@ViewHeaderBackground"
DialogBackgroundColor: "@SurfaceBase"
GroupboxBackgroundColor: "@SurfaceBase"
GroupboxBorderColor: "@BorderStrong"
MenuBackgroundColor: "@SurfaceOverlay"
ButtonTopBackgroundColor: "@ControlBackground"
ButtonBottomBackgroundColor: "@ControlBackground"
ButtonBackgroundHooverColor: "@ControlBackgroundHover"
ButtonBorderColor: "@ControlBorder"
ButtonBorderHooverColor: "@BorderHover"
CheckedButtonTopBackgroundColor: "@AccentSubtle"
CheckedButtonBottomBackgroundColor: "@AccentSubtle"
DefaultButtonTopBackgroundColor: "@ControlBackground"
DefaultButtonBottomBackgroundColor: "@ControlBackground"
DefaultButtonBorderColor: "@BorderEmphasis"
ToolButtonCheckedBorderColor: "@BorderHover"
ToolButtonCheckedBackground: "@AccentStrong"
CheckBoxBackgroundColor: "@FieldBackground"
CheckBoxBorderColor: "@IndicatorBorder"
RadioButtonBackgroundColor: "@FieldBackground"
RadioButtonBorderColor: "@IndicatorBorder"
TextEditFieldBackgroundColor: "@FieldBackground"
TextForegroundColor: "@TextPrimary"
TextDisabledColor: "@TextDisabled"
TextSelectBackgroundColor: "@AccentStrong"
TextUrlColor: "@TextLink"
ScrollbarBackgroundColor: "@ScrollbarTrack"
TabbarBackgroundColor: "@SurfaceBase"
ActiveTabBackgroundColor: "@AccentSubtle"
InActiveTabBackgroundColor: "@SurfaceBase"
AccentBackgroundColor: "@AccentSubtle"
AccentHoverColor: "@AccentStrong"
SketcherFullyConstrainedColor: "@StatusSuccess"
SketcherUnderConstrainedColor: "@TextPrimary"
SketcherEmptySketchColor: "@TextPrimary"
SketcherConflictingConstraintsColor: "@StatusError"
SketcherMalformedConstraintsColor: "@StatusError"
SketcherSolverFailedColor: "@StatusError"
SketcherRedundantConstraintsColor: "@StatusWarning"
SketcherPartiallyRedundantConstraintsColor: "@TextLink"
3DViewBackgroundRefColor: "@BackgroundColor"
IconsLocationFolderName: "images_classic"
InputFieldBorderRadius: "2px"
ToolbarButtonsPadding: "2px"
StylesheetIconsColor: "black"
PrimaryColorLighten1: "palette(midlight)"
PrimaryColorLighten2: "palette(midlight)"
PrimaryColorLighten3: "palette(light)"
PrimaryColorLighten4: "palette(light)"
PrimaryColorLighten5: "palette(light)"
PrimaryColorLighten6: "palette(light)"
PrimaryColorDarken1: "palette(mid)"
PrimaryColorDarken2: "palette(mid)"
PrimaryColorDarken3: "palette(mid)"
PrimaryColorDarken4: "palette(dark)"
PrimaryColorDarken5: "palette(dark)"
PrimaryColorDarken6: "palette(shadow)"
