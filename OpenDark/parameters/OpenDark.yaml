# OpenDark: A modern Dark theme for FreeCAD based on the Open-Color palette
# Generated by tools/make_themes.py from tools/themes/OpenDark.theme. Edit that file, not this one.

# ---- Palette ----
0_SeedBackground: "#222427"
0_SeedForeground: "#dee1e4"
0_SeedAccent: "#339af0"
0_SeedOnAccent: "#ffffff"
0_SeedError: "#ff8787"
0_SeedWarning: "#ffa94d"
0_SeedSuccess: "#69db7c"
0_SeedHighlight: "#15aabf"
0_SeedRecess: "#000000"
0_SeedExtreme: "#ffffff"
0_BorderWidth: "1px"
0_CornerRadius: "2px"
0_CornerRadiusLarge: "3px"

# ---- Roles: the only tokens the stylesheet uses ----
# Text
TextPrimary: "@0_SeedForeground"
TextSecondary: "blend(@0_SeedBackground, @0_SeedForeground, 75)"
TextDisabled: "blend(@0_SeedBackground, @0_SeedForeground, 55)"
TextStrong: "blend(@0_SeedForeground, @0_SeedExtreme, 78)"
TextLink: "blend(@0_SeedAccent, @0_SeedExtreme, 33)"
# Surfaces
SurfaceBase: "@0_SeedBackground"
SurfaceOverlay: "blend(@0_SeedBackground, @0_SeedRecess, 17)"
SurfaceOverlayHover: "@0_SeedBackground"
MenuBarBackground: "blend(@0_SeedBackground, @0_SeedRecess, 17)"
SurfaceHover: "blend(@0_SeedBackground, @0_SeedForeground, 22)"
SurfaceDisabled: "blend(@0_SeedBackground, @0_SeedForeground, 5)"
# Inputs and controls
FieldBackground: "blend(@0_SeedBackground, @0_SeedRecess, 17)"
FieldBorder: "blend(@0_SeedBackground, @0_SeedForeground, 55)"
ControlBackground: "blend(@0_SeedBackground, @0_SeedForeground, 22)"
ControlBackgroundHover: "blend(@0_SeedBackground, @0_SeedForeground, 5)"
ControlBorder: "blend(@0_SeedBackground, @0_SeedForeground, 55)"
IndicatorBorder: "blend(@0_SeedBackground, @0_SeedForeground, 55)"
# Accent: Subtle is the hover tint, Strong the selected fill
AccentColor: "@0_SeedAccent"
AccentSubtle: "blend(@0_SeedBackground, @0_SeedAccent, 19)"
AccentSubtleBorder: "blend(@0_SeedAccent, @0_SeedRecess, 3)"
TextOnAccentSubtle: "blend(@0_SeedForeground, @0_SeedExtreme, 78)"
AccentStrong: "@0_SeedAccent"
TextOnAccent: "@0_SeedOnAccent"
# Borders
BorderSubtle: "blend(@0_SeedBackground, @0_SeedForeground, 5)"
BorderStrong: "blend(@0_SeedBackground, @0_SeedForeground, 22)"
BorderDisabled: "blend(@0_SeedBackground, @0_SeedForeground, 5)"
BorderHover: "blend(@0_SeedAccent, @0_SeedRecess, 3)"
BorderFocus: "blend(@0_SeedAccent, @0_SeedRecess, 3)"
BorderEmphasis: "@0_SeedAccent"
# Item views
ViewAlternateRow: "@0_SeedBackground"
ViewGridLines: "blend(@0_SeedBackground, @0_SeedForeground, 22)"
ViewHeaderBackground: "blend(@0_SeedBackground, @0_SeedForeground, 5)"
ViewHeaderBorder: "blend(@0_SeedBackground, @0_SeedRecess, 17)"
ViewGroupBackground: "blend(@0_SeedBackground, @0_SeedForeground, 22)"
# Scrollbars, progress, tooltips
ScrollbarTrack: "blend(@0_SeedBackground, @0_SeedRecess, 17)"
ScrollbarHandle: "blend(@0_SeedBackground, @0_SeedForeground, 55)"
ScrollbarHandleHover: "@0_SeedAccent"
ProgressBackground: "blend(@0_SeedBackground, @0_SeedRecess, 17)"
ProgressChunk: "blend(@0_SeedAccent, @0_SeedRecess, 18)"
ProgressText: "blend(@0_SeedForeground, @0_SeedExtreme, 78)"
TooltipBackground: "blend(@0_SeedAccent, @0_SeedRecess, 11)"
TooltipText: "blend(@0_SeedForeground, @0_SeedExtreme, 78)"
TooltipBorder: "blend(@0_SeedBackground, @0_SeedAccent, 33)"
# Overlay panels
OverlayHeaderBackground: "blend(@0_SeedBackground, @0_SeedForeground, 5)"
OverlayGroupBackground: "blend(@0_SeedBackground, @0_SeedForeground, 5)"
OverlayTitleBackground: "rgba(34, 36, 39, 191)"
# Images
IconVariant: "ondark"
IconVariantOnAccent: "ondark"
# Geometry
BorderWidth: "@0_BorderWidth"
CornerRadius: "@0_CornerRadius"
CornerRadiusLarge: "@0_CornerRadiusLarge"
# Status and 3D view (used by the .cfg and the stock Sketcher tokens, not by the stylesheet)
StatusError: "@0_SeedError"
StatusWarning: "@0_SeedWarning"
StatusSuccess: "@0_SeedSuccess"
ViewportHighlight: "@0_SeedHighlight"
ViewportSelection: "blend(@0_SeedHighlight, @0_SeedExtreme, 12)"

# ---- Stock FreeCAD token names, for core widgets and other addons ----
PrimaryColor: "@SurfaceBase"
GeneralBackgroundColor: "@SurfaceBase"
GeneralAlternateBackgroundColor: "@ViewAlternateRow"
GeneralBackgroundHoverColor: "@SurfaceHover"
GeneralBorderColor: "@BorderSubtle"
GeneralBorderHoverColor: "@BorderHover"
GeneralDisabledBackgroundColor: "@SurfaceDisabled"
GeneralGridLinesColor: "@ViewGridLines"
GeneralHeaderBackgroundColor: "@ViewHeaderBackground"
DialogBackgroundColor: "@SurfaceBase"
GroupboxBackgroundColor: "@SurfaceBase"
GroupboxBorderColor: "@BorderStrong"
MenuBackgroundColor: "@SurfaceOverlay"
ButtonTopBackgroundColor: "@ControlBackground"
ButtonBottomBackgroundColor: "@ControlBackground"
ButtonBackgroundHooverColor: "@ControlBackgroundHover"
ButtonBorderColor: "@ControlBorder"
ButtonBorderHooverColor: "@BorderHover"
CheckedButtonTopBackgroundColor: "@AccentSubtle"
CheckedButtonBottomBackgroundColor: "@AccentSubtle"
DefaultButtonTopBackgroundColor: "@ControlBackground"
DefaultButtonBottomBackgroundColor: "@ControlBackground"
DefaultButtonBorderColor: "@BorderEmphasis"
ToolButtonCheckedBorderColor: "@BorderHover"
ToolButtonCheckedBackground: "@AccentStrong"
CheckBoxBackgroundColor: "@FieldBackground"
CheckBoxBorderColor: "@IndicatorBorder"
RadioButtonBackgroundColor: "@FieldBackground"
RadioButtonBorderColor: "@IndicatorBorder"
TextEditFieldBackgroundColor: "@FieldBackground"
TextForegroundColor: "@TextPrimary"
TextDisabledColor: "@TextDisabled"
TextSelectBackgroundColor: "@AccentStrong"
TextUrlColor: "@TextLink"
ScrollbarBackgroundColor: "@ScrollbarTrack"
TabbarBackgroundColor: "@SurfaceBase"
ActiveTabBackgroundColor: "@AccentSubtle"
InActiveTabBackgroundColor: "@SurfaceBase"
AccentBackgroundColor: "@AccentSubtle"
AccentHoverColor: "@AccentStrong"
SketcherFullyConstrainedColor: "@StatusSuccess"
SketcherUnderConstrainedColor: "@TextPrimary"
SketcherEmptySketchColor: "@TextPrimary"
SketcherConflictingConstraintsColor: "@StatusError"
SketcherMalformedConstraintsColor: "@StatusError"
SketcherSolverFailedColor: "@StatusError"
SketcherRedundantConstraintsColor: "@StatusWarning"
SketcherPartiallyRedundantConstraintsColor: "@TextLink"
3DViewBackgroundRefColor: "@BackgroundColor"
IconsLocationFolderName: "images_classic"
InputFieldBorderRadius: "2px"
ToolbarButtonsPadding: "2px"
StylesheetIconsColor: "white"
PrimaryColorLighten1: "lighten(@PrimaryColor, 20)"
PrimaryColorLighten2: "lighten(@PrimaryColor, 40)"
PrimaryColorLighten3: "lighten(@PrimaryColor, 80)"
PrimaryColorLighten4: "lighten(@PrimaryColor, 100)"
PrimaryColorLighten5: "lighten(@PrimaryColor, 300)"
PrimaryColorLighten6: "lighten(@PrimaryColor, 5890)"
PrimaryColorDarken1: "darken(@PrimaryColor, 5)"
PrimaryColorDarken2: "darken(@PrimaryColor, 8)"
PrimaryColorDarken3: "darken(@PrimaryColor, 15)"
PrimaryColorDarken4: "darken(@PrimaryColor, 20)"
PrimaryColorDarken5: "darken(@PrimaryColor, 200)"
PrimaryColorDarken6: "darken(@PrimaryColor, 5890)"
